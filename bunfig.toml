[install]
# Isolated installs: a package resolves only the dependencies it declares (design decision 1).
linker = "isolated"
# Dependencies are pinned exactly (spine, Consistency Conventions).
exact = true

[test]
coverageThreshold = 0.8
coverageSkipTestFiles = true
# The validators the build generates are loaded from a temporary folder by their tests; generated
# code is no source of ours, and its line coverage follows the schemas, not the tests.
coveragePathIgnorePatterns = ["**/askboard-validators-*/**"]
