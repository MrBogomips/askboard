schema: spec-driven

# Project context: constraints that guide OpenSpec artifacts and workflows.
context: |
  Write all artifacts in English.
  Requirements: docs/prd-askboard-2026-10-25/prd.md (FR, NFR, SM, R IDs) and its addendum.md. Each proposal cites the IDs it serves.
  Backlog: GitHub Issues of MrBogomips/askboard (CLAUDE.md, The backlog). Each proposal's Why cites the Issues it resolves, one line each: "Issue: #n".
  Architecture: AD-1 to AD-22 in docs/architecture-askboard-2026-10-27/ARCHITECTURE-SPINE.md bind every change; each design cites the AD IDs it relies on. SOLUTION-DESIGN.md explains them; where the two differ, the spine wins.
  UX: docs/ux-askboard-2026-10-27/DESIGN.md (how it looks) and EXPERIENCE.md (how it works). A change with a user-facing surface follows them and cites the sections it implements; both win over the mockups in mockups/.
  A change that alters a requirement or an architecture decision updates the PRD or the spine in the same change. AD IDs stay stable: amend in place, add the next AD-n, never renumber.
  Capabilities follow the units in SOLUTION-DESIGN.md §3.1. Epics are OpenSpec changes. The spikes in SOLUTION-DESIGN.md §10 run as changes before the decisions they gate.
  AskBoard depends on nothing in AXFX. The contract AXFX requires of AskBoard lives in the AXFX PRD (§5.10, §6, §7) in the planning repository; changes to it are requested there.
  Designs and tasks cover macOS and Linux, including devcontainers and CI runners; Windows only through WSL (NFR-7).

# Per-artifact rules, added to the schema's own guidance. The agent harness (CLAUDE.md, Agent
# harness) relies on them.
rules:
  design:
    - List the changes in flight that this change touches (`openspec list` and their designs) as merge points, with every seam it borrows from them. Borrow only names present on main; a seam from an unmerged change is re-checked at the rebase before the pull request.
    - Write a new version of a contract schema set as "next minor after main's", never as a number taken from another change in flight; the number is bound at the rebase before the pull request (the askboard-contract-versioning skill).
    - Mark every assumption about Claude Code's run-time behaviour (the mod API, hooks, agent and teammate IDs, auto mode, permission prompts) "needs probe", and verify it against the documentation or with a probe task in group 0 before anything relies on it.
    - A change that adds or alters a widget's keys declares its key table (the vocabulary's actions, own actions the PO approved, each entry's visible counterpart) and its contextual help (`KeyHint`, `KeysButton`, the keys panel), or states the reason `keys-coverage.test.ts` gives for a widget without one.
  tasks:
    - Each task names its tests first and carries a Verify clause.
    - End each implementation group with a review checkpoint task. It is a spec review of the group's range. It adds a security review when the group touches the board host or its local API, hooks, the mod, the contract's schemas or validators, the view's sandbox or page policy, the file system or the network.
    - A group that adds or alters a widget's keys names first the tests of its key table (parity with the handler, and with the toolbar in both directions), of its tooltips and of its keys panel, each with a Verify clause.
    - Keep each as-built note to about five lines. Record what was built, the test counts and the deviations.
    - The documents task writes the change's record in its own file `docs/as-built/<change-id>.md` (what it built, where the code lives, the names and seams it added, the versions it bound; no status), never in CLAUDE.md, which changes only when a rule it states changes.

# Per-operation guidance, advisory, for apply and archive.
operations:
  apply:
    guidance:
      - The session that runs apply coordinates through the askboard-delivery skill. It delegates each task group to the askboard-implementer agent. It runs each group's review checkpoint with askboard-spec-reviewer, and adds askboard-security-reviewer when the checkpoint asks for it.
      - An askboard-implementer agent implements the group it was given directly and does not delegate it further.
      - Raise the implementer's effort to high for contract and core groups, for rebase conflicts and for a second attempt at a task.
  archive:
    guidance:
      - Archive only after the pull request is merged. Every Verify task must be ticked or have its reason recorded. The change's as-built note `docs/as-built/<change-id>.md` must describe the change as built; the archive does not edit CLAUDE.md. The PRD, the spine and the UX documents must carry the updates the change states.
