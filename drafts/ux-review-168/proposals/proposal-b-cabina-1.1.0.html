<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskBoard · Proposta B «Cabina» 1.1.0</title>
<!--
  Mockup of Proposal B "Cabina" for the AskBoard answering flow (Issue #168), version 1.1.0.
  1.1.0 settles the open points of direction B: "Carta" drawn on B's layout (the default), the accepted wording
  of the review report section 4, one question per view, the single-question board, the rail width, the homes of
  the postponed warning and of the "updates need a choice" link, stable short question numbers, and the ask pill
  as the PO decided on Issue #213 (option 1: it says what the user answered; delivery only in the receipts). The alternatives the PO must choose between are reachable from the mockup strip.
  Self-contained: no network, system fonts, inline SVG icons from Lucide (ISC; some derived from Feather, MIT).
  Colour tokens use the product's role names so they can move into DESIGN.md.
-->

:root{
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 4px;
  --hdr-h: 84px;
  --mock-h: 0px;
  --legend-w: 0px;
  --rail-w: 268px;
  --t: 180ms;
  color-scheme: light;
}
:root.dark{ color-scheme: dark; }
:root[data-palette="contrasto"]{ --hair: 1px; }
:root[data-palette="contrasto"] .card, :root[data-palette="contrasto"] .btn{ border-width: 1.5px; }

/* ===================== Base ===================== */
*{ box-sizing: border-box; }
html, body{ margin: 0; }
body{ background: var(--background); color: var(--foreground); font: 13px/1.45 var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, textarea{ font: inherit; color: inherit; }
.mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.ic{ flex: none; display: inline-block; vertical-align: -3px; }
:focus{ outline: none; }
:focus-visible{ outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 3px; }
[data-palette="contrasto"] :focus-visible{ outline-width: 3px; }
kbd{ font: 500 10.5px/1 var(--font-mono); display:inline-flex; align-items:center; justify-content:center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 3px;
  border: 1px solid var(--border-strong); color: var(--muted-foreground); background: var(--card); letter-spacing: .02em; }
.btn-primary kbd{ background: transparent; border-color: color-mix(in srgb, var(--primary-foreground) 55%, transparent); color: var(--primary-foreground); }
.label{ font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }

/* Buttons */
.btn{ display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius: var(--radius); border:1px solid var(--border); background: var(--card);
  color: var(--foreground); font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap; transition: background var(--t), border-color var(--t), color var(--t); }
.btn:hover{ background: var(--muted); border-color: var(--border-strong); }
.btn .ic{ color: var(--muted-foreground); }
.btn-primary{ background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.btn-primary .ic{ color: var(--primary-foreground); }
.btn-primary:hover{ background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-primary[aria-disabled="true"]{ background: var(--muted); border: 1px dashed var(--border-strong); color: var(--muted-foreground); cursor: not-allowed; }
.btn-primary[aria-disabled="true"] .ic, .btn-primary[aria-disabled="true"] kbd{ color: var(--muted-foreground); border-color: var(--border-strong); }
.btn-ghost{ border-color: transparent; background: transparent; }
.btn-ghost:hover{ background: var(--muted); border-color: transparent; }
.btn-icon{ width:28px; padding:0; justify-content:center; }
.btn-sm{ height:24px; padding:0 8px; font-size:12px; }
.btn[aria-pressed="true"]{ background: var(--primary-subtle); border-color: var(--primary); color: var(--primary-text); }
.btn[aria-pressed="true"] .ic{ color: var(--primary-text); }
.linkbtn{ border:0; background:none; padding:0; color: var(--primary-text); font-weight:500; cursor:pointer; font-size:12px; display:inline-flex; align-items:center; gap:4px; }
.linkbtn:hover{ text-decoration: underline; text-underline-offset: 2px; }

/* Segmented control (radix ToggleGroup-like) */
.seg{ display:inline-flex; padding:2px; gap:2px; background: var(--muted); border:1px solid var(--border); border-radius: 5px; }
.seg button{ height:24px; padding:0 9px; border:1px solid transparent; border-radius:3px; background:transparent; font-size:12px; font-weight:500; color: var(--muted-foreground); cursor:pointer; white-space:nowrap; }
.seg button:hover{ color: var(--foreground); }
.seg button[aria-checked="true"]{ background: var(--card); color: var(--foreground); border-color: var(--border-strong); box-shadow: var(--shadow); }
.seg.full{ display:flex; } .seg.full button{ flex:1; }

/* ===================== Board frame ===================== */
#app{ padding-top: var(--mock-h); margin-right: var(--legend-w); min-height: 100vh; }
#hdr{ position: sticky; top: var(--mock-h); z-index: 20; height: var(--hdr-h); background: var(--card); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); }
.hrow{ display:flex; align-items:center; gap:12px; padding: 0 16px; }
.hrow1{ height: 40px; border-bottom: 1px solid var(--border); }
.hrow2{ height: 43px; }
.brand{ display:flex; align-items:baseline; gap:10px; min-width:0; }
.brand h1{ margin:0; font-size:14.5px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.005em; }
.brand .askid{ font-size:11.5px; color: var(--muted-foreground); }
.pill{ display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 8px; border-radius:11px; font-size:12px; font-weight:500; white-space:nowrap; }
.pill-agent{ background: var(--agent-subtle); color: var(--agent-text); }
.pill-agent .dot{ width:6px; height:6px; border-radius:50%; background: var(--agent); }
.spacer{ flex:1; }
.tools{ display:flex; align-items:center; gap:4px; }
.vsep{ width:1px; height:20px; background: var(--border); flex:none; }

/* Progress strip */
.progress{ display:flex; align-items:center; gap:10px; min-width:0; }
.strip{ display:flex; gap:8px; align-items:stretch; }
.strip .grp{ display:flex; gap:2px; }
.segm{ position:relative; width:30px; height:24px; border:0; padding:0; border-radius:3px; background: var(--muted); color: var(--muted-foreground); cursor:pointer; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.segm::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background: var(--bar, var(--border-strong)); }
.segm:hover{ filter: brightness(.96); }
:root.dark .segm:hover{ filter: brightness(1.15); }
.segm[aria-current="true"]{ box-shadow: inset 0 0 0 1.5px var(--foreground); }
.segm .newdot{ position:absolute; top:2px; right:2px; width:6px; height:6px; border-radius:50%; background: var(--info); }
.count{ font-size:12.5px; white-space:nowrap; color: var(--foreground-secondary); }
.count b{ font-family: var(--font-mono); font-weight:600; color: var(--foreground); }

/* State ladder visual vocabulary */
.st-todo{ --tone: var(--muted-foreground); --tone-bg: var(--muted); --bar: var(--border-strong); }
.st-draft{ --tone: var(--primary-text); --tone-bg: var(--primary-subtle); --bar: repeating-linear-gradient(90deg, var(--primary) 0 4px, transparent 4px 7px); --vbar: repeating-linear-gradient(180deg, var(--primary) 0 5px, transparent 5px 9px); }
.st-held{ --tone: var(--primary-text); --tone-bg: var(--primary-subtle); --bar: var(--primary); --vbar: var(--primary); }
.st-sent{ --tone: var(--success-text); --tone-bg: var(--success-subtle); --bar: repeating-linear-gradient(90deg, var(--success) 0 4px, transparent 4px 7px); --vbar: repeating-linear-gradient(180deg, var(--success) 0 5px, transparent 5px 9px); }
.st-delivered{ --tone: var(--success-text); --tone-bg: var(--success-subtle); --bar: var(--success); --vbar: var(--success); }
.st-postponed{ --tone: var(--muted-foreground); --tone-bg: var(--muted); --bar: repeating-linear-gradient(90deg, var(--muted-foreground) 0 2px, transparent 2px 4px); --vbar: repeating-linear-gradient(180deg, var(--muted-foreground) 0 2px, transparent 2px 4px); }
.st-declined{ --tone: var(--muted-foreground); --tone-bg: var(--muted); --bar: var(--muted-foreground); --vbar: var(--muted-foreground); }
.segm{ background: var(--tone-bg); color: var(--tone); }
.stbadge{ display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 7px; border-radius:3px; font-size:11.5px; font-weight:600; color: var(--tone); background: var(--tone-bg); white-space:nowrap; }
.badge{ display:inline-flex; align-items:center; gap:4px; height:18px; padding:0 6px; border-radius:3px; font-size:11px; font-weight:600; white-space:nowrap; }
.badge-rec{ background: var(--agent-subtle); color: var(--agent-text); }
.badge-new{ background: var(--info-subtle); color: var(--info-text); }

/* Layout */
.body{ display:flex; align-items:flex-start; }
#rail{ position: sticky; top: calc(var(--mock-h) + var(--hdr-h)); height: calc(100vh - var(--mock-h) - var(--hdr-h)); width: var(--rail-w); flex:none; display:flex; flex-direction:column;
  border-right: 1px solid var(--border); background: var(--background); }
.outline{ flex:1; overflow:auto; padding: 10px 8px 12px; }
.outline .label{ padding: 2px 8px 6px; display:flex; justify-content:space-between; }
.oarea{ margin-top: 2px; }
.oarea-h{ display:flex; justify-content:space-between; align-items:baseline; padding: 5px 8px 2px; font-size:12px; font-weight:650; color: var(--foreground); }
.oarea-h .mono{ font-size:11px; font-weight:500; color: var(--muted-foreground); }
.oitem{ position:relative; display:grid; grid-template-columns: 16px 1fr auto; column-gap:8px; align-items:center; width:100%; text-align:left; padding: 3px 8px; border:0; border-radius:3px; background:transparent; cursor:pointer; color: var(--foreground); }
.oitem:hover{ background: var(--muted); }
.oitem[aria-current="true"]{ background: var(--card); box-shadow: inset 2px 0 0 var(--primary), 0 0 0 1px var(--border); }
.oitem .ic{ color: var(--tone); }
.oitem .t{ font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.oitem .qid{ font: 11px var(--font-mono); color: var(--muted-foreground); }
.oitem .s{ grid-column: 2 / 4; font-size:11.5px; color: var(--tone); margin-top:-1px; display:flex; gap:6px; align-items:center; }

/* Outbox */
.outbox{ flex:none; border-top: 1px solid var(--border-strong); background: var(--card); padding: 10px 12px 12px; position:relative; }
.outbox h2{ margin:0 0 8px; display:flex; align-items:center; gap:6px; }
.outbox h2:focus-visible{ outline-offset: 3px; }
.ledger{ display:grid; grid-template-columns: repeat(4, 1fr); border:1px solid var(--border); border-radius: var(--radius); margin: 10px 0 8px; overflow:hidden; }
.cell{ padding: 6px 6px 5px; border-left: 1px solid var(--border); position:relative; }
.cell:first-child{ border-left:0; }
.cell .n{ display:flex; align-items:center; gap:5px; font: 600 15px/1.1 var(--font-mono); color: var(--tone); }
.cell .n .ic{ color: var(--tone); }
.cell .l{ font-size:11px; color: var(--muted-foreground); margin-top:2px; white-space:nowrap; }
.cell.off .n{ color: var(--muted-foreground); }
.cell::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background: var(--bar); opacity:.9; }
.cell.pulse{ animation: pulse 700ms ease-out; }
@keyframes pulse{ 0%{ background: var(--tone-bg); } 30%{ background: var(--tone-bg); box-shadow: inset 0 0 0 1.5px var(--tone); } 100%{ background: transparent; box-shadow: none; } }
.helper{ font-size:12px; color: var(--muted-foreground); margin: 6px 0 0; line-height:1.4; }
.sendrow{ display:flex; flex-direction:column; gap:6px; }
.sendrow .btn{ width:100%; justify-content:center; height:32px; font-size:13px; }
.sendrow .note{ font-size:12px; color: var(--foreground-secondary); display:flex; gap:6px; align-items:flex-start; }
.sendrow .note .ic{ color: var(--primary-text); margin-top:1px; }
.none{ font-size:12px; color: var(--muted-foreground); display:flex; align-items:center; gap:6px; height:32px; justify-content:center; border:1px dashed var(--border); border-radius: var(--radius); }

/* Main */
#main{ flex:1; min-width:0; padding: 14px 24px 45vh; }
.col{ max-width: 920px; margin: 0 auto; }
@media (min-width: 1600px){ .col{ max-width: 1060px; } }
.area{ margin-bottom: 18px; }
.area-h{ display:flex; align-items:baseline; gap:10px; padding: 4px 2px 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.area-h h2{ margin:0; font-size:13px; font-weight:650; }
.area-h .mono{ font-size:11.5px; color: var(--muted-foreground); }
.area-h .done{ display:inline-flex; gap:4px; align-items:center; font-size:11.5px; font-weight:600; color: var(--success-text); }

/* Card */
.card{ scroll-margin-top: calc(var(--mock-h) + var(--hdr-h) + 12px); position:relative; background: var(--card); border:1px solid var(--border); border-radius: var(--radius); padding: 10px 14px 12px 18px; margin-bottom: 8px; transition: border-color var(--t), box-shadow var(--t); }
.card::before{ content:""; position:absolute; left:-1px; top:-1px; bottom:-1px; width:4px; border-radius: var(--radius) 0 0 var(--radius); background: var(--vbar, var(--border)); }
.card.st-todo::before{ background: var(--border); }
.card.focusin{ border-color: var(--border-strong); }
.card.arrive{ animation: arrive 1600ms ease-out; }
@keyframes arrive{ 0%,35%{ box-shadow: 0 0 0 2px var(--ring); } 100%{ box-shadow: 0 0 0 2px transparent; } }
.chead{ display:flex; align-items:center; gap:8px; min-height:22px; }
.chead .qid{ font: 500 11.5px var(--font-mono); color: var(--muted-foreground); }
.chip{ display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:3px; background: var(--muted); border:1px solid var(--border); font-size:11.5px; font-weight:600; color: var(--foreground-secondary); max-width: 220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card h3{ margin: 6px 0 8px; font-size:15px; line-height:1.35; font-weight:640; letter-spacing:-.005em; scroll-margin-top: calc(var(--mock-h) + var(--hdr-h) + 18px); }
.card h3:focus-visible{ outline-offset: 3px; }
.opts{ display:flex; flex-direction:column; gap:3px; }
.opt{ position:relative; display:flex; align-items:center; gap:10px; min-height:34px; padding: 5px 10px; border:1px solid var(--border); border-radius: var(--radius); cursor:pointer; background: var(--card); transition: border-color var(--t), background var(--t); }
.opt:hover{ border-color: var(--border-strong); }
.opt input{ appearance:none; margin:0; width:14px; height:14px; border-radius:50%; border:1.5px solid var(--border-strong); background: var(--card); flex:none; display:grid; place-content:center; cursor:pointer; }
.opt input:checked{ border-color: var(--primary); }
.opt input:checked::after{ content:""; width:6px; height:6px; border-radius:50%; background: var(--primary); }
.opt:has(input:checked){ border-color: var(--primary); background: var(--primary-subtle); }
.opt:has(input:focus-visible){ outline: 2px solid var(--ring); outline-offset: 1px; }
.opt input:focus-visible{ outline:none; }
.opt .ol{ font-weight:550; white-space:nowrap; }
.opt .od{ color: var(--muted-foreground); font-size:12.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.opt .end{ margin-left:auto; display:flex; align-items:center; gap:10px; flex:none; }
.locked .opt{ cursor:default; }
.locked .opt:hover{ border-color: var(--border); }
.locked .opt.chosen{ border-color: var(--tone); background: var(--tone-bg); }
.locked .opt:not(.chosen) .ol, .locked .opt:not(.chosen) .od{ color: var(--muted-foreground); }
.locked .opt:not(.chosen){ border-style: dashed; background: transparent; }
.opt .chk{ width:14px; height:14px; display:grid; place-content:center; color: var(--tone); flex:none; }
.opt .dim{ width:14px; height:14px; border-radius:50%; border:1.5px dashed var(--border); flex:none; }
.fields{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.field label{ display:block; font-size:12px; font-weight:550; margin-bottom:4px; color: var(--foreground-secondary); }
.field label .req{ color: var(--muted-foreground); font-weight:400; }
.field input{ width:100%; height:30px; padding: 0 8px; border:1px solid var(--border-strong); border-radius: var(--radius); background: var(--card); }
.field input:focus-visible{ outline: 2px solid var(--ring); outline-offset: 0; border-color: var(--ring); }
.field input[aria-invalid="true"]{ border-color: var(--destructive); }
.field .hint{ font-size:11.5px; color: var(--muted-foreground); margin-top:3px; }
.field .err{ font-size:11.5px; color: var(--destructive-text); margin-top:3px; display:flex; gap:4px; align-items:center; font-weight:500; }
.field .val{ height:30px; display:flex; align-items:center; padding: 0 8px; border:1px dashed var(--border); border-radius: var(--radius); color: var(--foreground); }
.noteln{ margin-top:6px; }
.notebox textarea{ width:100%; min-height:52px; margin-top:6px; padding:6px 8px; border:1px solid var(--border-strong); border-radius: var(--radius); background: var(--card); resize: vertical; }
.cacts{ display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
.reason{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500; color: var(--muted-foreground); }
.reason.err{ color: var(--destructive-text); }
.hintpre{ display:inline-flex; gap:5px; align-items:center; font-size:12px; color: var(--agent-text); }
.revnote{ margin-top:8px; font-size:12px; color: var(--foreground-secondary); display:flex; gap:6px; align-items:center; }
.stateline{ display:flex; align-items:center; gap:10px; margin-top:10px; font-size:12.5px; }
.stateline .sum{ color: var(--foreground-secondary); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stateline .sum b{ color: var(--foreground); font-weight:600; }
.stateline time{ font: 11.5px var(--font-mono); color: var(--muted-foreground); }

/* After-answer footer: the B signature */
.afoot{ display:flex; align-items:center; gap:10px; margin: 10px -14px -12px -18px; padding: 8px 14px 8px 18px; border-top: 1px solid var(--border); background: var(--tone-bg); border-radius: 0 0 var(--radius) var(--radius); }
.afoot .what{ display:flex; align-items:center; gap:6px; font-weight:650; color: var(--tone); white-space:nowrap; }
.afoot .dotsep{ color: var(--muted-foreground); }
.afoot .nxt{ color: var(--foreground); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.afoot .nxt .mono{ color: var(--muted-foreground); font-size:11.5px; }
.afoot .why{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; color: var(--info-text); }
.afoot .btn-primary{ height:30px; padding: 0 12px; }
.afoot .btn-primary:focus{ outline: 2px solid var(--ring); outline-offset: 2px; }
.afoot .done-area{ display:inline-flex; gap:4px; align-items:center; color: var(--success-text); font-weight:600; }

/* Card menu */
.menu{ position:absolute; right:10px; top:34px; z-index:15; min-width: 170px; background: var(--popover); border:1px solid var(--border-strong); border-radius: var(--radius); box-shadow: 0 6px 20px rgb(0 0 0 / .18); padding:4px; }
.menu button{ display:flex; width:100%; gap:8px; align-items:center; height:28px; padding: 0 8px; border:0; background:none; border-radius:3px; cursor:pointer; font-size:12.5px; text-align:left; }
.menu button:hover, .menu button:focus-visible{ background: var(--muted); outline:none; }
.menu .ic{ color: var(--muted-foreground); }

/* Navigator (one per view) */
.qnav{ display:flex; align-items:center; gap:8px; padding: 2px 0 10px; }
.qnav .pos{ font-size:12.5px; color: var(--foreground-secondary); }
.qnav .pos b{ font-family: var(--font-mono); color: var(--foreground); }

/* Completion panel */
.done-panel{ position:relative; border:1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 14px 16px; margin-bottom: 14px; display:grid; grid-template-columns: 28px 1fr auto; gap: 4px 12px; align-items:start; }
.done-panel.ok{ border-color: var(--success); box-shadow: inset 4px 0 0 var(--success); }
.done-panel.open{ border-color: var(--border-strong); box-shadow: inset 4px 0 0 var(--muted-foreground); }
.done-panel .ic{ margin-top:1px; }
.done-panel.ok > .ic{ color: var(--success-text); }
.done-panel.open > .ic{ color: var(--muted-foreground); }
.done-panel h2{ margin:0; font-size:15px; font-weight:650; scroll-margin-top: calc(var(--mock-h) + var(--hdr-h) + 18px); }
.done-panel p{ margin: 2px 0 0; color: var(--foreground-secondary); }
.done-panel .counts{ display:flex; gap:14px; margin-top:8px; flex-wrap:wrap; }
.done-panel .counts span{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; }
.done-panel .counts b{ font-family: var(--font-mono); font-size:14px; }

/* Popovers (settings, keys, theme) */
.pop{ position:absolute; z-index:40; right:12px; top: 38px; width: 300px; background: var(--popover); border:1px solid var(--border-strong); border-radius: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .22); padding: 12px; }
.pop h3{ margin: 0 0 8px; font-size:12.5px; }
.pop .row{ margin-bottom:10px; }
.pop .row .label{ display:block; margin-bottom:5px; }
.keys{ width:100%; border-collapse:collapse; font-size:12.5px; }
.keys td{ padding: 5px 0; border-top: 1px solid var(--border); vertical-align: middle; }
.keys td:last-child{ text-align:right; white-space:nowrap; }
.keys kbd{ margin-left:2px; }

/* Toasts */
#toasts{ position: fixed; z-index: 30; top: calc(var(--mock-h) + var(--hdr-h) + 10px); right: calc(var(--legend-w) + 18px); display:flex; flex-direction:column; gap:8px; width: 380px; pointer-events:none; }
.toast{ pointer-events:auto; display:flex; align-items:center; gap:10px; padding: 9px 10px 9px 12px; background: var(--popover); border:1px solid var(--border-strong); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); font-size:12.5px; animation: tin 200ms ease-out; }
.toast .ic.lead{ color: var(--primary-text); }
.toast.info .ic.lead{ color: var(--info-text); }
.toast .msg{ flex:1; }
@keyframes tin{ from{ opacity:0; transform: translateY(-4px); } to{ opacity:1; transform:none; } }

/* Dialog */
.scrim{ position:fixed; inset:0; z-index:60; background: rgb(0 0 0 / .45); display:grid; place-items:center; }
.dialog{ width: 440px; background: var(--popover); border:1px solid var(--border-strong); border-radius: 6px; padding: 16px; box-shadow: 0 20px 50px rgb(0 0 0 / .35); }
.dialog h2{ margin:0 0 6px; font-size:15px; }
.dialog p{ margin: 0 0 14px; color: var(--foreground-secondary); }
.dialog .acts{ display:flex; justify-content:flex-end; gap:8px; }

/* ===================== Annotations ===================== */
.anno{ display:none; }
body.annos .anno{ display:inline-flex; position:absolute; z-index:12; top:-9px; left:-9px; width:18px; height:18px; border-radius:50%; align-items:center; justify-content:center;
  background:#ffd23f; color:#1a1400; border: 1.5px solid #1a1400; font: 700 10.5px/1 var(--font-mono); box-shadow: 0 1px 3px rgb(0 0 0 / .35); pointer-events:none; }
.rel{ position:relative; }
body.annos .anno.in{ top:6px; left:auto; right:8px; }
body.annos .anno.r{ left:auto; right:-9px; }
body.annos .anno.r150{ left:auto; right:150px; }
#legend{ display:none; }
body.annos #legend{ display:block; position:fixed; z-index:50; right:0; top: var(--mock-h); bottom:0; width: 320px; overflow:auto; background:#1d1d1f; color:#f1f1f1; border-left: 3px dashed #ffd23f; padding: 14px 14px 24px; font: 12px/1.45 var(--font-sans); }
#legend h2{ margin: 0 0 4px; font-size:13px; color:#ffd23f; }
#legend p.sub{ margin:0 0 10px; color:#bdbdbd; font-size:11.5px; }
#legend ol{ list-style:none; padding:0; margin:0; }
#legend li{ display:grid; grid-template-columns: 22px 1fr; gap:8px; padding: 7px 0; border-top: 1px solid #333; }
#legend li .n{ width:18px; height:18px; border-radius:50%; background:#ffd23f; color:#1a1400; font: 700 10.5px/18px var(--font-mono); text-align:center; }
#legend li .f{ display:block; margin-top:2px; font: 11px var(--font-mono); color:#9fd3ff; }

/* ===================== Mockup controls (not part of the board) ===================== */
#mock{ position: fixed; z-index: 70; top:0; left:0; right:0; background: repeating-linear-gradient(135deg, #1b1b1d 0 14px, #202023 14px 28px); color:#eee; border-bottom: 3px dashed #ffd23f; font: 12px/1.3 var(--font-sans); }
#mock .in{ display:flex; flex-wrap:wrap; align-items:center; gap: 8px 16px; padding: 8px 14px; }
#mock .tag{ font: 700 11px var(--font-mono); letter-spacing:.08em; color:#1a1400; background:#ffd23f; padding: 3px 7px; border-radius: 3px; }
#mock .tagnote{ color:#cfcfcf; font-size:11.5px; }
#mock .grp{ display:flex; align-items:center; gap:6px; }
#mock .grp > span{ color:#bdbdbd; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
#mock .mseg{ display:inline-flex; border:1px solid #555; border-radius:4px; overflow:hidden; }
#mock .mseg button{ background:#2a2a2d; color:#ddd; border:0; border-left:1px solid #444; padding: 4px 8px; font: 12px var(--font-sans); cursor:pointer; }
#mock .mseg button:first-child{ border-left:0; }
#mock .mseg button[aria-pressed="true"]{ background:#ffd23f; color:#1a1400; font-weight:600; }
#mock .mbtn{ background:#2a2a2d; color:#eee; border:1px solid #666; border-radius:4px; padding: 4px 9px; font: 12px var(--font-sans); cursor:pointer; }
#mock .mbtn:hover{ border-color:#ffd23f; }
#mock .mbtn:disabled{ opacity:.45; cursor:default; }
#mock button:focus-visible{ outline: 2px solid #ffd23f; outline-offset: 2px; }
#mock.collapsed{ display:none; }
#mockhandle{ position: fixed; z-index: 70; right: 10px; bottom: 10px; display:none; background:#1d1d1f; color:#ffd23f; border: 2px dashed #ffd23f; border-radius: 4px; padding: 4px 9px; font: 700 11px var(--font-mono); cursor:pointer; letter-spacing:.06em; }
#mockhandle.on{ display:block; }
body.clean #mockhandle{ display:none; }

/* ===================== 1.1.0 additions ===================== */
/* Ledger in two rows of two, for a narrow rail */
.ledger.two{ grid-template-columns: 1fr 1fr; }
.ledger.two .cell:nth-child(3){ border-left:0; }
.ledger.two .cell:nth-child(n+3){ border-top: 1px solid var(--border); }
.ledger .cell .l{ overflow:hidden; text-overflow: ellipsis; }
/* Postponed warning: a fixed line with the postponed marker, no fill, no warning colour, no dismiss (DESIGN, Bottom action bar) */
.hrow1 .brand{ flex: 0 1 auto; min-width: 0; }
.hrow1 .brand .askid{ white-space: nowrap; }
.hrow1 > .rel:not(.brand), .hrow1 > .pill{ flex: none; }
.ppwarn{ flex: 0 0 auto; display:inline-flex; align-items:center; gap:6px; min-width:0; font-size:12.5px; color: var(--foreground); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ppwarn .ic{ color: var(--muted-foreground); }
.ppwarn span{ overflow:hidden; text-overflow:ellipsis; }
.outbox .ppwarn{ white-space:normal; align-items:flex-start; margin-top:8px; font-size:12px; }
.outbox .ppwarn .ic{ margin-top:1px; }
/* Ask pill: what the user has answered (AD-10; #213 answered with option 1). It never carries a delivery count and never
   uses the delivery icons (send, check-check): delivery is said only by the receipts, the ledger and the completion line. */
.pill-ask{ border:1px solid var(--border); background: var(--muted); color: var(--foreground-secondary); }
.pill-ask.partial{ background: var(--card); border-color: var(--border-strong); color: var(--foreground); }
.pill-ask.answered{ background: var(--success-subtle); border-color: transparent; color: var(--success-text); }
.pill-ask .ic{ color: currentColor; }
/* Agent-change notice on a card, and the outbox line that counts them */
.chg{ margin-top:10px; border:1px solid var(--agent); border-radius: var(--radius); background: var(--agent-subtle); padding: 8px 10px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; }
.chg .t{ display:inline-flex; align-items:center; gap:6px; font-weight:600; color: var(--agent-text); }
.chg .t .ic{ color: var(--agent-text); }
.chg .sub{ color: var(--foreground-secondary); font-size:12px; }
.chg .acts{ display:flex; gap:6px; margin-left:auto; }
.updates{ display:flex; align-items:flex-start; gap:6px; margin-top:6px; font-size:12px; }
.updates .ic{ color: var(--agent-text); margin-top:1px; }
.updates .linkbtn{ text-align:left; color: var(--agent-text); }
.oitem .flag{ display:inline-flex; align-items:center; gap:3px; color: var(--agent-text); font-weight:600; }
/* Removed by the agent: a gap left in the fixed numbers */
.gapnote{ font: 11px var(--font-mono); color: var(--muted-foreground); padding: 0 8px 2px 32px; }
/* Single-question board: one header row, no rail */
#app.solo{ --hdr-h: 41px; }
#app.solo .hrow1{ border-bottom: 0; }
#app.solo #main{ padding-bottom: 24px; }
/* Rail with the outbox only (variant of one question per view) */
#rail.onlybox .outbox{ border-top:0; }
#rail[hidden]{ display:none; }
/* Mockup strip, second row: the points to decide; "*" marks the recommended option */
#mock .in2{ border-top: 1px dashed #555; padding-top:6px; }
#mock .in2 > .grp > span{ color:#ffd23f; }
#mock .mseg button[data-rec="1"]::after{ content:" *"; color:#ffd23f; }
#mock .mseg button[data-rec="1"][aria-pressed="true"]::after{ color:#1a1400; }

/* ===================== Motion ===================== */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .card.arrive{ box-shadow: 0 0 0 2px var(--ring); }
}
</style>
</head>
<body>
<div id="mock" role="region" aria-label="Mockup controls"></div>
<button id="mockhandle" type="button"></button>
<aside id="legend" aria-label="Annotations"></aside>
<div id="app">
  <header id="hdr"></header>
  <div class="body">
    <nav id="rail"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="toasts"></div>
<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="dialog-root"></div>

    const f = x.fields, t = T();
    const emailBad = f.email.trim() && !/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(f.email.trim());
    if (emailBad) return { ok: false, reason: t.fix_field(t.f_email), err: true, field: "email" };
    if (!f.team.trim()) return { ok: false, reason: t.fill_field(t.f_team), err: false, field: "team" };

  }
  if (!x.sel) return { ok: false, reason: T().choose_option, err: false };

}

// Next question to do, from `fromId` in board order, wrapping once. A question the agent just added goes first, with its reason.
function nextTodo(fromId, dir = 1) {
  const list = S.qs, n = list.length, start = fromId ? idx(fromId) : -1;
  const order = []; for (let k = 1; k <= n; k++) order.push(list[(start + dir * k + n * 2) % n]);
  const cand = order.filter(x => x.id !== fromId && isTodo(x));
  if (dir === 1) { const nw = cand.find(x => x.isNew); if (nw) return { q: nw, reason: "new" }; }
  const plain = cand.find(x => x.state !== "postponed"); if (plain) return { q: plain };
  const pp = cand.find(x => x.state === "postponed"); if (pp) return { q: pp };
  return null;
}
function isComplete() { return !S.qs.some(x => x.state === "todo" || x.state === "draft" || x.state === "held") && S.qs.some(x => ["sent", "delivered", "declined"].includes(x.state)); }

  }).join("");

      : `<div class="none rel">${anno(8)}${ic("package", 14)}${t.nothing_ready}</div>`)
    : "";
  rail.innerHTML = `
    ${withOutline ? `<div class="outline rel" aria-label="${t.outline}">${anno(5, "in")}<div class="label"><span>${t.outline}</span></div>${items}</div>` : ""}
    <section class="outbox rel" aria-labelledby="obx-h">${anno(6, "in")}${anno(25, "r")}
      <h2 id="obx-h" class="label" tabindex="-1" data-fk="obx-h">${ic("inbox", 14)}${t.mode_label}</h2>
      <div class="seg full rel" role="radiogroup" aria-label="${t.mode_label}">${anno(7)}
        <button type="button" role="radio" aria-checked="${S.mode === "one"}" data-act="mode" data-v="one" data-fk="mode-one">${t.mode_one}</button>
        <button type="button" role="radio" aria-checked="${S.mode === "all"}" data-act="mode" data-v="all" data-fk="mode-all">${t.mode_all}</button>
      </div>

/* ===================== Render orchestration with focus restore ===================== */
function render(focusKey) {
  const ae = document.activeElement, fk = focusKey || (ae && ae.dataset && ae.dataset.fk), selEnd = ae && ae.selectionEnd;
  applyTheme(); renderMock(); renderLegend(); renderHeader(); renderRail(); renderMain(); renderToasts(); renderDialog();
  if (fk) { const el = document.querySelector(`[data-fk="${fk}"]`); if (el) { el.focus({ preventScroll: true }); if (typeof selEnd === "number" && el.setSelectionRange && !focusKey) try { el.setSelectionRange(selEnd, selEnd); } catch (e) {} } }
  observeCards();
}
// Light update while typing in a field: keep the input, refresh what depends on it.
function renderLive(x) {
  renderHeader(); renderRail();
  const card = document.getElementById("c-" + x.id); if (!card) return;
  card.className = `card st-${x.state} focusin`;
  card.querySelector("[data-stb]").innerHTML = `${ic(STATE_ICON[x.state], 13)}${stLabel(x.state)}`;
  const v = validation(x), acts = card.querySelector(".cacts");
  if (acts) acts.outerHTML = renderActs(x, v, primaryOf(x), { first: idx(x.id) === 0 });
  if (x.kind === "fields") {
    const t = T(), bad = v.field === "email" && v.err, inp = card.querySelector("#f-email");
    card.querySelector('[data-err="email"]').innerHTML = bad ? `<div class="err" id="e-email">${ic("circle-alert", 13)}${t.err_pattern}</div>` : `<div class="hint">nome@dominio.it</div>`;
    if (bad) { inp.setAttribute("aria-invalid", "true"); inp.setAttribute("aria-describedby", "e-email"); } else { inp.removeAttribute("aria-invalid"); inp.removeAttribute("aria-describedby"); }
  }
}

/* ===================== Current question follows the view (sections) ===================== */
let io = null, inView = new Set();
// 1.1.0: the observer reports only the cards whose visibility changed, so the set of cards in the band is kept across
// callbacks and the topmost one is chosen (1.0.0 took the topmost of the changed entries only, which could skip one).
function observeCards() {
  if (io) io.disconnect();
  inView = new Set();
  if (S.pres !== "sections") return;
  const cs = getComputedStyle(document.documentElement);
  const top = (parseInt(cs.getPropertyValue("--mock-h")) || 0) + (parseInt(cs.getPropertyValue("--hdr-h")) || 84) + 12;
  io = new IntersectionObserver(entries => {
    entries.forEach(e => e.isIntersecting ? inView.add(e.target) : inView.delete(e.target));
    const vis = [...inView].filter(el => el.isConnected && el.getBoundingClientRect().bottom > top + 80).sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
    if (!vis.length) return;
    const id = vis[0].dataset.card; if (id === S.current) return;
    S.current = id; markCurrent();
  }, { rootMargin: `-${top}px 0px -55% 0px` });
  document.querySelectorAll("[data-card]").forEach(c => io.observe(c));
}

/* ===================== Navigation ===================== */

/* ===================== Acts ===================== */
function stamp() { const d = new Date(); return d.toTimeString().slice(0, 5); }

}
function doContinue() {

}
function sendAll() {

}
function setMode(m) {

function prefill() {

let toastId = 0;

function setPres(v) {

/* ===================== Events ===================== */
document.addEventListener("click", e => {

    if (k === "mode") { setMode(v); return; }

  }

    case "sendall": sendAll(); break;
    case "mode": setMode(v); break;
    case "dl-cancel": S.dialog = null; render("mode-all"); break;
    case "dl-go": S.dialog = null; S.mode = "one"; sendAll(); if (!isComplete()) render("mode-one"); break;

document.addEventListener("change", e => {
