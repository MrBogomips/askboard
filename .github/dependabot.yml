version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Follows the Bun pin in packageManager, which Dependabot does not bump: bump both by hand
      # (tools/workspace.test.ts fails if they differ).
      - dependency-name: "@types/bun"
