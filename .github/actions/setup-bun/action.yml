name: Set up the repository
description: Node from package.json, Bun from npm at the packageManager version, then setup.sh --ci (the pinned dependencies and the Codex files).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
    # Bun from npm at the packageManager version: oven-sh/setup-bun fails the adoption rule.
    # Its postinstall links the binary, so that one script is allowed, and no other.
    - name: Install Bun
      shell: bash
      run: |
        version=$(node -p 'require("./package.json").packageManager.replace(/^bun@/, "")')
        npm install --global --strict-allow-scripts --allow-scripts="bun@${version}" "bun@${version}"
        bun --version
    # The same setup as a local checkout (CLAUDE.md, Development commands).
    - run: sh ./setup.sh --ci
      shell: bash
