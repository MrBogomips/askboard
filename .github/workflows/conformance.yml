name: Conformance
on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: macos-latest
permissions:
  contents: read
jobs:
  conformance:
    name: Conformance, ${{ matrix.runtime }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    env:
      BROWSER: ${{ github.workspace }}/packages/view/test/browser/fixtures/record-link.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # The suite's three configurations (mod and hooks, mod disabled, hooks disabled) run in turn;
      # on Node 24 it is the runtime AskBoard ships on until AXFX NFR-1 admits the executable (AD-19).
      - run: bun packages/server/test/conformance/run.ts --runtime ${{ matrix.runtime }}
