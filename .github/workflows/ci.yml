name: CI

# openspec and check run on every pull request and push to main. The browser and conformance suites
# cost more macOS minutes (10x Linux) and run locally before a merge: here they run only on demand
# (workflow_dispatch). To add Linux, pass `runs-on: ubuntu-24.04` to the calls below (one line each).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openspec:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/openspec.yml
    with:
      runs-on: macos-latest

  check:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/check.yml
    with:
      runs-on: macos-latest
    secrets: inherit

  browser:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/browser.yml
    with:
      runs-on: macos-latest

  conformance:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/conformance.yml
    with:
      runs-on: macos-latest
