name: CI

# The repository is public, so GitHub-hosted runners cost nothing, macOS included: what is left to
# spare is waiting time.
#   pull request  openspec, check on Linux (NFR-7), codex: the checks a merge waits for
#   push to main  the same on macOS, which finds what only macOS shows within one merge
#   nightly       the same on macOS, and codex with the latest rulesync
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. A push to main, the nightly run and
# a dispatch are never cancelled: each has its own group (the commit), so a quick second merge does
# not leave the first merge unchecked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  openspec:
    uses: ./.github/workflows/openspec.yml
    with:
      runs-on: ubuntu-24.04

  # Always runs, so its status name is the same for every change: when the diff holds only
  # documents it reports success after one step (tools/ci/changed-paths.sh), which a required check
  # accepts, as it does not a job skipped by `if`.
  check:
    uses: ./.github/workflows/check.yml
    with:
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'macos-latest' }}
    secrets: inherit

  # The Codex files, regenerated by the latest rulesync, when a source of theirs changes (and
  # nightly: rulesync moves on its own). Always listed, like check, and nothing reads the files.
  codex:
    uses: ./.github/workflows/codex.yml
    with:
      runs-on: ubuntu-24.04
