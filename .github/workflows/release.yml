name: Release

# Publishes the plugin (plugin-release, design decision 6): the built tree goes to the `release`
# branch, tagged `v<version>`, and the bundle, the tree as a zip and their SHA-256 become a GitHub
# release. Manual only, and only on `main`. Nothing runs on a pull request or a push: merging a change
# never releases. `build` and `smoke-linux` only read; `publish` is the one job with a write token,
# and it runs git and gh alone. No `github` context reaches a `run:` script except through `env:`.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Check, build, assemble and smoke on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A release runs only from main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Preflight
        run: bun tools/release/preflight.ts
      - name: Check
        run: bun run check
        env:
          # The licence check asks the GitHub API whether direct dependencies are archived.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: bun run build
      - name: Assemble the tree
        run: bun tools/release/assemble.ts --out release/tree
      - name: Write the tool names the smoke expects
        run: bun tools/release/tool-names.ts --out release/tools.json
      - name: Smoke the tree on Node
        run: node tools/release/smoke.ts release/tree --tools release/tools.json
      - name: Write the release files
        run: bun tools/release/package.ts --tree release/tree --out release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          # The tree holds .claude-plugin/, which is hidden.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  smoke-linux:
    name: Smoke on Linux
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Smoke the tree on Node
        run: node tools/release/smoke.ts release/tree --tools release/tools.json
      - name: Verify the SHA-256 file
        run: |
          cd release
          sha256sum -c SHA256SUMS

  publish:
    name: Publish the release branch, the tag and the GitHub release
    needs: [build, smoke-linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Verify the files and read the version
        run: |
          VERSION=$(jq -r .version release/tree/.claude-plugin/plugin.json)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The tree's version is not major.minor.patch."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          cd release
          sha256sum -c SHA256SUMS
      - name: Commit the tree to the release branch and tag it
        run: |
          git init --quiet work
          cd work
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::The tag v${VERSION} already exists."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin release > /dev/null; then
            git fetch --quiet --depth 1 origin release
            git checkout --quiet -B release FETCH_HEAD
          else
            git checkout --quiet --orphan release
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../release/tree/. .
          git add --all
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "release: v${VERSION} from ${GITHUB_SHA}"
          git tag "v${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the branch and the tag together
        run: |
          cd work
          git push --atomic origin HEAD:refs/heads/release "refs/tags/v${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the GitHub release
        run: |
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --title "v${VERSION}" --notes-file "release/notes.md" --verify-tag "release/askboard-${VERSION}.mjs" "release/askboard-${VERSION}.zip" "release/SHA256SUMS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
