name: Check
on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: macos-latest
permissions:
  contents: read
jobs:
  check:
    name: Type check, lint, tests, import and licence checks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun test --coverage 2>&1 | grep -A70 "main.test.ts:" | cut -c1-260 | grep -B1 -A14 "DIAG\|the entry" | head -150
        continue-on-error: true
      - run: bun run test 2>&1 | grep -A70 "main.test.ts:" | cut -c1-260 | grep -B1 -A14 "DIAG\|the entry" | head -150
        continue-on-error: true
      - run: bun test --coverage packages/server/test/main.test.ts 2>&1 | head -80 | cut -c1-260
        continue-on-error: true
      - run: bun run check
        env:
          # The licence check asks the GitHub API whether direct dependencies are archived.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
